name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typy, build, unit testy a závislosti
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc --noEmit runs inside build; no Supabase keys are needed to compile.
      - run: npm run build
      - run: npm run test:unit
      - run: npm audit --omit=dev --audit-level=high
