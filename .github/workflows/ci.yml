name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typy, build, unit testy a závislosti
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders: unit tests import the Supabase client module, which refuses to load
      # without these. Nothing in CI talks to a database.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc --noEmit runs inside build; no Supabase keys are needed to compile.
      - run: npm run build
      - run: npm run test:unit
      - run: npm audit --omit=dev --audit-level=high
